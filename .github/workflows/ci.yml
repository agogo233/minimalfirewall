name: Build Win x64 Portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build win-x64 single-file portable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/MinimalFirewall.csproj

      - name: Publish portable
        shell: pwsh
        run: >
          dotnet publish src/MinimalFirewall.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o ${{ github.workspace }}/artifacts/publish

      - name: Normalize artifact name
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish'
          if (Test-Path "$dir/MinimalFirewall.exe") {
            Rename-Item "$dir/MinimalFirewall.exe" 'Minimal.Firewall.exe'
          }
          if (Test-Path "$dir/MinimalFirewall.exe.config") {
            Rename-Item "$dir/MinimalFirewall.exe.config" 'Minimal.Firewall.exe.config'
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalFirewall-win-x64
          path: artifacts/publish
          if-no-files-found: error
          compression-level: 9
